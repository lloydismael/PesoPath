<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PesoPath — Budget & Debt-Free Tracker</title>
  <meta name="description" content="Budget tracker, debt-freedom planner and installment tracker. Works offline; your data stays on your device." />

  <!-- Installable app (PWA) -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#16a34a" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1512" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PesoPath" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="logo">🌿</span><div><b>PesoPath</b><small>Plan today. Debt-free tomorrow.</small></div></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button class="btn ghost sm" id="privacyBtn" title="Hide amounts">🙈 Privacy</button>
        <button class="btn ghost sm" id="themeBtn" title="Toggle theme">🌙 Theme</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p class="muted" id="pageSub"></p>
        </div>
        <div class="topbar-actions">
          <div class="month-picker">
            <button class="icon-btn" id="prevMonth" aria-label="Previous month">‹</button>
            <span id="monthLabel"></span>
            <button class="icon-btn" id="nextMonth" aria-label="Next month">›</button>
          </div>
          <button class="btn primary" id="quickAdd">＋ Add Transaction</button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <!-- Setup guide: floating button, checklist drawer, spotlight layer, "next step" card -->
  <button class="guide-fab" id="guideFab" hidden></button>
  <aside class="guide-drawer" id="guideDrawer" aria-label="Setup guide" hidden></aside>
  <div class="spot-layer" id="spotLayer" hidden></div>
  <div class="guide-next" id="guideNext" hidden></div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h3 id="modalTitle"></h3><button class="icon-btn" id="modalClose" aria-label="Close">✕</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="js/installments.js"></script>
  <script src="js/store.js"></script>
  <script src="js/debt.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Installable-app support: secure contexts only (https or localhost).
    // Skipped inside the native Capacitor shell, which already bundles the app offline.
    const C = window.Capacitor;
    const isNativeShell = !!(C && C.isNativePlatform && C.isNativePlatform());
    if ('serviceWorker' in navigator && !isNativeShell) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
