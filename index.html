<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PesoPath — Budget & Debt-Free Tracker</title>
  <meta name="description" content="Budget tracker, debt-freedom planner and installment tracker. Works offline; your data stays on your device." />

  <!-- Installable app (PWA) -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f4f7f5" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PesoPath" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <script>
    if (window.Capacitor && typeof window.Capacitor.getPlatform === 'function') {
      const platform = window.Capacitor.getPlatform();
      if (platform === 'ios') document.documentElement.classList.add('ios-app');
      if (platform === 'android') document.documentElement.classList.add('android-app');
    }
  </script>
  <link rel="stylesheet" href="css/styles.css?v=1.2.5" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="logo">🌿</span><div><b>PesoPath</b><small>Plan today. Debt-free tomorrow.</small></div></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button class="btn ghost sm" id="privacyBtn" title="Hide amounts">🙈 Privacy</button>
        <button class="btn ghost sm" id="themeBtn" title="Toggle theme">🌙 Theme</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p class="muted" id="pageSub"></p>
        </div>
        <div class="topbar-actions">
          <div class="month-picker" role="group" aria-label="Viewing month">
            <button class="icon-btn" id="prevMonth" type="button" aria-label="Previous month">‹</button>
            <button class="month-picker-trigger" id="monthLabel" type="button" aria-haspopup="dialog">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>
              <span id="monthLabelText" aria-live="polite"></span>
              <svg class="month-picker-chevron" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"/></svg>
            </button>
            <button class="icon-btn" id="nextMonth" type="button" aria-label="Next month">›</button>
          </div>
          <button class="btn primary" id="quickAdd">＋ Add Transaction</button>
        </div>
        <div class="ios-display-controls" role="group" aria-label="Display settings">
          <button class="icon-btn" id="iosPrivacyBtn" type="button">Hide</button>
          <button class="icon-btn" id="iosThemeBtn" type="button">Dark</button>
        </div>
      </header>
      <aside class="mobile-download card" id="mobileDownloadOffer" hidden aria-labelledby="mobileDownloadTitle">
        <div class="mobile-download-header">
          <h2 id="mobileDownloadTitle">Get PesoPath on your phone</h2>
          <button class="icon-btn" id="mobileDownloadDismiss" type="button" aria-label="Dismiss download offer">&times;</button>
        </div>
        <p id="mobileDownloadDescription"></p>
        <a class="btn primary" id="mobileDownloadLink" download></a>
        <p class="muted" id="mobileDownloadPwa"></p>
      </aside>
      <section id="view" class="view" tabindex="-1"></section>
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="Main navigation"></nav>

  <!-- Setup guide: floating button, checklist drawer, spotlight layer, "next step" card -->
  <button class="guide-fab" id="guideFab" hidden></button>
  <aside class="guide-drawer" id="guideDrawer" aria-label="Setup guide" hidden></aside>
  <div class="spot-layer" id="spotLayer" hidden></div>
  <div class="guide-next" id="guideNext" hidden></div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
      <div class="modal-head"><h3 id="modalTitle"></h3><button class="icon-btn" id="modalClose" aria-label="Close">✕</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="js/installments.js?v=1.2.5"></script>
  <script src="js/store.js?v=1.2.5"></script>
  <script src="js/debt.js?v=1.2.5"></script>
  <script src="js/ui.js?v=1.2.5"></script>
  <script src="js/views.js?v=1.2.5"></script>
  <script src="js/guide.js?v=1.2.5"></script>
  <script src="js/app.js?v=1.2.5"></script>
  <script src="js/mobile-download.js?v=1.2.5"></script>
  <script>
    // Installable-app support: secure contexts only (https or localhost).
    // Skipped inside the native Capacitor shell, which already bundles the app offline.
    const C = window.Capacitor;
    const isNativeShell = !!(C && C.isNativePlatform && C.isNativePlatform());
    if ('serviceWorker' in navigator && !isNativeShell) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
