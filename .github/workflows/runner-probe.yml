name: runner-probe

on:
  workflow_dispatch:

jobs:
  mac13:
    runs-on: macos-13
    steps:
      - run: uname -m && xcodebuild -version

  mac15:
    runs-on: macos-15
    steps:
      - run: uname -m && xcodebuild -version

  maclatest:
    runs-on: macos-latest
    steps:
      - run: uname -m && xcodebuild -version
